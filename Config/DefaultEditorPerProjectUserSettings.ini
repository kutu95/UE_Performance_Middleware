; ULevelEditorMiscSettings uses config=EditorPerProjectUserSettings (NOT Editor.ini).
; Without this, EditorEngine forces AppMult=0 whenever the editor window loses focus,
; which cuts Godfrey/ACE speech to a short blip even with UnfocusedVolumeMultiplier=1.
[/Script/UnrealEd.LevelEditorMiscSettings]
bAllowBackgroundAudio=True
EditorVolumeLevel=1.0
bEnableRealTimeAudio=True

[/Script/UnrealEd.LevelEditorPlaySettings]
EnableGameSound=True
NewWindowWidth=1200
NewWindowHeight=1920
CenterNewWindow=True
LastExecutedPlayModeType=PlayMode_InEditorFloating
AdditionalLaunchParameters=-ResX=1200 -ResY=1920 -Windowed
